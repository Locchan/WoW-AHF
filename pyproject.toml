[project]
name = "wow-ahf"
version = "0.1.0"
description = "WoW AH parser"
authors = [
    {name = "Jaroslaw Locchansky",email = "locchansky@gmail.com"}
]
license = {text = "MIT"}
requires-python = ">=3.14"
dependencies = [
    "numpy>=2.0",
    "psycopg[binary]>=3.2",
]

[tool.poetry]
package-mode = false

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
